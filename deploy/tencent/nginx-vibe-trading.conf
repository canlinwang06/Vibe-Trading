# Include this file inside the existing Tencent Cloud port-80 server block.
# It intentionally adds only Vibe-Trading locations and leaves the existing
# Qikong root site plus any non-Vibe APIs untouched.

location = /vibe-trading {
    return 301 /vibe-trading/;
}

location ~ ^/vibe-trading/(agent|settings|runtime|runs|sessions|swarm|upload|mandate|live|alpha-zoo|compare|correlation|event-records|event-radar|sector-radar|event-reactions|candidate-pool|strategy-lab|backtest-results|risk-portfolio|trade-plan|joinquant-export|strategy-lifecycle|daily-workflow|data-sources)(/|$) {
    auth_basic "Vibe-Trading";
    auth_basic_user_file /etc/nginx/.htpasswd-vibe-trading;
    return 404;
}

location ~ ^/vibe-trading/advisor/(holdings|watchlist|journal)(/|$) {
    auth_basic "Vibe-Trading";
    auth_basic_user_file /etc/nginx/.htpasswd-vibe-trading;
    return 404;
}

location /vibe-trading/api/ {
    auth_basic "Vibe-Trading";
    auth_basic_user_file /etc/nginx/.htpasswd-vibe-trading;
    return 404;
}

location /vibe-trading/ {
    auth_basic "Vibe-Trading";
    auth_basic_user_file /etc/nginx/.htpasswd-vibe-trading;
    proxy_pass http://vibe_trading_cloud/;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8899;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /health {
    auth_basic "Vibe-Trading";
    auth_basic_user_file /etc/nginx/.htpasswd-vibe-trading;
    proxy_pass http://vibe_trading_cloud/health;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8899;
}

location = /api/advisor/today-snapshot {
    auth_basic "Vibe-Trading";
    auth_basic_user_file /etc/nginx/.htpasswd-vibe-trading;
    proxy_pass http://vibe_trading_cloud;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8899;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/advisor/stocks-snapshot {
    auth_basic "Vibe-Trading";
    auth_basic_user_file /etc/nginx/.htpasswd-vibe-trading;
    proxy_pass http://vibe_trading_cloud;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8899;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/advisor/memory-snapshot {
    auth_basic "Vibe-Trading";
    auth_basic_user_file /etc/nginx/.htpasswd-vibe-trading;
    proxy_pass http://vibe_trading_cloud;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:8899;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/advisor/ {
    auth_basic "Vibe-Trading";
    auth_basic_user_file /etc/nginx/.htpasswd-vibe-trading;
    return 404;
}
