upstream vibe_trading_cloud {
    server 127.0.0.1:8899;
}

server {
    listen 80;
    server_name _;

    # Keep the cloud surface private. Create the password file with:
    #   htpasswd -c /etc/nginx/.htpasswd-vibe-trading <user>
    auth_basic "Vibe-Trading";
    auth_basic_user_file /etc/nginx/.htpasswd-vibe-trading;

    location = /vibe-trading {
        return 301 /vibe-trading/;
    }

    location ~ ^/vibe-trading/(agent|settings|runtime|runs|sessions|swarm|upload|mandate|live|alpha-zoo|compare|correlation|event-records|event-radar|sector-radar|event-reactions|candidate-pool|strategy-lab|backtest-results|risk-portfolio|trade-plan|joinquant-export|strategy-lifecycle|daily-workflow|data-sources)(/|$) {
        return 404;
    }

    location ~ ^/vibe-trading/advisor/(holdings|watchlist|journal)(/|$) {
        return 404;
    }

    location /vibe-trading/api/ {
        return 404;
    }

    location /vibe-trading/ {
        proxy_pass http://vibe_trading_cloud/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://vibe_trading_cloud/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location ~ ^/api/advisor/(today-snapshot|stocks-snapshot|memory-snapshot)$ {
        proxy_pass http://vibe_trading_cloud;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        return 404;
    }

    location ~ ^/(agent|settings|runtime|runs|sessions|swarm|upload|mandate|live|alpha-zoo|compare|correlation|event-records|event-radar|sector-radar|event-reactions|candidate-pool|strategy-lab|backtest-results|risk-portfolio|trade-plan|joinquant-export|strategy-lifecycle|daily-workflow|data-sources)(/|$) {
        return 404;
    }

    location / {
        return 404;
    }
}
